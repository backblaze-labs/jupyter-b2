[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyter-b2"
version = "0.1.0"
description = "Jupyter/IPython magic commands and fsspec backend for Backblaze B2 Cloud Storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Gonzalo Peña-Castellanos", email = "goanpeca@gmail.com" },
]
keywords = [
    "backblaze",
    "b2",
    "cloud-storage",
    "jupyter",
    "ipython",
    "magic",
    "fsspec",
    "data-science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "b2sdk>=2.0.0",
    "ipython>=7.0",
    "tqdm>=4.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
fsspec = [
    "fsspec>=2023.1.0",
]
pandas = [
    "pandas>=1.5",
    "pyarrow>=10.0",
]
all = [
    "jupyter-b2[fsspec,pandas]",
]
dev = [
    "jupyter-b2[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.0",
    "moto[s3]>=5.0",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "polars>=0.20",
]

[project.urls]
Homepage = "https://github.com/goanpeca/jupyter-b2"
Repository = "https://github.com/goanpeca/jupyter-b2"
Documentation = "https://github.com/goanpeca/jupyter-b2#readme"
Issues = "https://github.com/goanpeca/jupyter-b2/issues"

[project.entry-points."fsspec.specs"]
b2 = "jupyter_b2.fsspec_backend:B2FileSystem"

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_b2"]

[tool.hatch.build.targets.sdist]
include = ["src/jupyter_b2", "README.md", "LICENSE.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "D",    # pydocstyle
]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=jupyter_b2 --cov-report=term-missing"
